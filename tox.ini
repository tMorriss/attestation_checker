[tox]
envlist = lint
skipsdist = True

[testenv]
setenv =
    PYTHONPATH = {toxinidir}

[testenv:lint]
deps = -r{toxinidir}/requirements_dev.txt
commands =
    flake8 . --count --exclude .tox,.venv,static --show-source --statistics --import-order-style smarkets

[flake8]
max-line-length = 140
ignore = E722,W503,N818
